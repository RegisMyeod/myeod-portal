    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0a0a0a;
      --white: #ffffff;
      --gray-50: #f8f8f8;
      --gray-100: #f0f0f0;
      --gray-200: #e0e0e0;
      --gray-400: #9a9a9a;
      --gray-600: #555555;
      --font: 'MazzardM', 'Arial Narrow', Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      overflow: hidden;
    }

    .waiting-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(180deg, rgba(248,248,248,0.6) 0%, rgba(255,255,255,1) 42%, rgba(248,248,248,0.35) 100%);
    }

    /* ── LOGO ── */
    .logo-stage {
      position: absolute;
      left: 2rem;
      right: 2rem;
      top: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      z-index: 2;
      animation: logoMoveUp 1s ease forwards;
      animation-delay: 6s;
    }

    .myeod-logo {
      width: min(72vw, 720px);
      max-height: 46vh;
      object-fit: contain;
      opacity: 0;
      transform: translateY(10px) scale(0.985);
      animation: logoIn 3s ease forwards;
      animation-delay: 0s;
    }

    /* ── CONTENT ── */
    .content-card {
      position: absolute;
      left: 2rem;
      right: 2rem;
      top: 58%;
      width: auto;
      max-width: 680px;
      min-height: 230px;
      margin: 0 auto;
      text-align: center;
      opacity: 0;
      transform: translateY(14px);
      animation: contentIn 1s ease forwards;
      animation-delay: 6.55s;
    }

    /* EYEBROW — ExtraLight 200, très espacé, ultra-fin */
    .eyebrow {
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 200;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 1.25rem;
    }

    /* H1 — Light 300, titrage fin et élégant */
    h1 {
      font-family: var(--font);
      font-size: clamp(1.85rem, 4.6vw, 3.4rem);
      font-weight: 300;
      font-style: normal;
      letter-spacing: -0.03em;
      line-height: 1.06;
      margin-bottom: 1.3rem;
      color: var(--black);
    }

    /* MESSAGE — Regular 400, lisibilité optimale */
    .message {
      max-width: 460px;
      margin: 0 auto;
      font-family: var(--font);
      font-size: clamp(0.88rem, 1.6vw, 1.02rem);
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: 0.02em;
      color: var(--gray-600);
    }

    /* STATUS PILL — Medium 500, capsule discrète */
    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
      padding: 0.55rem 1.4rem;
      border: 1px solid var(--gray-200);
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-600);
      background: rgba(255,255,255,0.82);
    }

    /* LANG ROTATOR */
    .lang-rotator {
      position: relative;
      min-height: 230px;
    }

    .lang-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      opacity: 0;
      will-change: opacity;
      animation-duration: 16s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-delay: 7s;
    }

    .lang-fr {
      opacity: 1;
      animation-name: langFr;
    }

    .lang-en {
      animation-name: langEn;
    }

    /* FOOTER — Thin 100, signature légère */
    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 1.5rem;
      text-align: center;
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 100;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gray-400);
      opacity: 0;
      animation: contentIn 1s ease forwards;
      animation-delay: 6.85s;
    }

    /* ── KEYFRAMES ── */
    @keyframes logoIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoMoveUp {
      to {
        top: 33%;
      }
    }

    @keyframes langFr {
      0%, 31.25%   { opacity: 1; }
      40.625%, 90.625% { opacity: 0; }
      100%         { opacity: 1; }
    }

    @keyframes langEn {
      0%, 40.625%  { opacity: 0; }
      50%, 81.25%  { opacity: 1; }
      90.625%, 100% { opacity: 0; }
    }

    @keyframes contentIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      .logo-stage,
      .myeod-logo,
      .content-card,
      .footer {
        animation: none;
      }
      .logo-stage {
        position: static;
        transform: none;
      }
      .content-card,
      .footer {
        opacity: 1;
        transform: none;
      }
      .lang-rotator { min-height: auto; }
      .lang-panel {
        position: static;
        animation: none;
        opacity: 1;
      }
      .lang-en { margin-top: 2rem; }
    }

    /* ── MOBILE ── */
    @media (max-width: 520px) {
      .waiting-page { padding: 1.25rem; }
      .logo-stage { left: 1.25rem; right: 1.25rem; }
      .myeod-logo { width: min(86vw, 520px); }
      .content-card {
        left: 1.25rem;
        right: 1.25rem;
        top: 56%;
        min-height: 250px;
      }
      .message { line-height: 1.75; }
      .footer { bottom: 1rem; padding: 0 1rem; }
    }
  </style>
