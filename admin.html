<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyEOD — Administration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#0a0a0a;
  --white:#ffffff;
  --gray-50:#f8f8f8;
  --gray-100:#f0f0f0;
  --gray-200:#e0e0e0;
  --gray-300:#c7c7c7;
  --gray-400:#9a9a9a;
  --gray-500:#777777;
  --gray-600:#555555;
  --font:'Arial Narrow',Arial,sans-serif;
  --radius:2px;
}
html,body{width:100%;min-height:100%;}
body{min-height:100vh;font-family:var(--font);background:var(--white);color:var(--black);overflow:auto;}

/* Header calé sur la page Accès collaborateurs */
.myeod-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 2.5rem;
  border-bottom:1px solid var(--gray-200);
  background:var(--white);
  position:sticky;
  top:0;
  z-index:100;
  width:100%;
  flex-shrink:0;
}
.myeod-header-logo{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.15rem;
  font-weight:800;
  letter-spacing:-0.04em;
  color:#1a1a1a;
  line-height:1;
}
.myeod-header-logo span{font-weight:300;color:var(--gray-400);}
.myeod-header-right{display:flex;align-items:center;gap:.65rem;margin-left:auto;}
.btn-nav-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  min-width:34px;
  padding:.4rem 0;
  font-size:.9rem;
  line-height:1;
  letter-spacing:0;
  font-weight:700;
  text-transform:uppercase;
  color:var(--gray-600);
  background:none;
  border:1px solid var(--gray-200);
  border-radius:var(--radius);
  cursor:pointer;
  font-family:var(--font);
  transition:border-color .2s,color .2s,background .2s;
}
.btn-nav-back:hover,.btn-nav-back:focus-visible{border-color:var(--black);color:var(--black);outline:none;}

.admin-page{
  min-height:calc(100vh - 105px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:3rem 2rem 4rem;
  background:#fff;
}
.admin-head{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:.45rem;
  width:min(100%,560px);
  margin:0 auto 2.4rem;
}
.admin-kicker{font-size:.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gray-400);}
.admin-title{font-size:clamp(1.8rem,3vw,2.5rem);font-weight:800;letter-spacing:-.02em;color:#1a1a1a;line-height:1.1;}
.admin-subtitle{max-width:520px;font-size:.78rem;line-height:1.7;letter-spacing:.05em;color:var(--gray-500);}

/* Tuiles alignées sur la page Index, 3 colonnes x 2 lignes */
.admin-cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(220px,260px));
  grid-template-rows:repeat(2,minmax(190px,1fr));
  gap:1.5rem;
  justify-content:center;
  width:100%;
  max-width:860px;
}
.admin-card{
  border:1px solid var(--gray-200);
  padding:2.2rem 1.8rem;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:.8rem;
  transition:border-color .2s,box-shadow .2s,transform .15s;
  background:#fff;
  position:relative;
  overflow:hidden;
  min-height:190px;
  text-decoration:none;
  color:inherit;
  font-family:var(--font);
  text-align:left;
}
.admin-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gray-200);transition:background .2s;}
.admin-card:hover{border-color:var(--gray-300);box-shadow:0 8px 32px rgba(0,0,0,.07);transform:translateY(-2px);}
.admin-card:hover::before{background:#1a1a1a;}
.admin-card-num{font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray-300);}
.admin-card-title{font-size:1.05rem;font-weight:700;letter-spacing:.02em;color:#1a1a1a;line-height:1.3;}
.admin-card-desc{font-size:.68rem;color:var(--gray-400);letter-spacing:.04em;line-height:1.7;}
.admin-card-arrow{font-size:.9rem;color:var(--gray-300);margin-top:auto;transition:transform .2s,color .2s;}
.admin-card:hover .admin-card-arrow{transform:translateX(4px);color:#1a1a1a;}
.admin-card.disabled{opacity:.48;cursor:not-allowed;}
.admin-card.disabled:hover{box-shadow:none;transform:none;border-color:var(--gray-200);}
.admin-card.disabled:hover::before{background:var(--gray-200);}
.admin-footer{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-300);text-align:center;margin-top:2.2rem;}
@media(max-width:900px){.admin-cards{grid-template-columns:repeat(2,minmax(220px,260px));grid-template-rows:auto;max-width:620px;}}
@media(max-width:640px){.myeod-header{padding:.9rem 1rem}.myeod-header-logo{height:54px;font-size:1.7rem}.admin-cards{grid-template-columns:1fr;max-width:320px}.admin-page{justify-content:flex-start;padding-top:3rem}}
</style>
<script>
function goBackToPreviousPage(){
  const fallback='acces-collaborateurs.html';
  try{
    if(window.history.length>1){
      window.history.back();
      window.setTimeout(function(){if(!document.hidden)window.location.href=fallback;},450);
      return;
    }
  }catch(e){}
  window.location.href=fallback;
}
function inactiveTile(label){
  alert(label+' : page à créer lors de la prochaine étape.');
}
</script>
</head>
<body>
<header class="myeod-header services-header">
  <div class="myeod-header-logo" aria-label="MyEOD">My<span>EOD</span></div>
  <div class="myeod-header-right">
    <button class="btn-nav-back" type="button" onclick="goBackToPreviousPage()" aria-label="Retour">←</button>
  </div>
</header>
<main class="admin-page">
  <section class="admin-head">
    <div class="admin-kicker">Parcours collaborateur</div>
    <h1 class="admin-title">Administration</h1>
    <p class="admin-subtitle">Choisissez l’espace administratif à ouvrir.</p>
  </section>
  <section class="admin-cards" aria-label="Navigation administration">
    <button class="admin-card disabled" type="button" onclick="inactiveTile('Juridique')">
      <span class="admin-card-num">01</span>
      <span class="admin-card-title">Juridique</span>
      <span class="admin-card-desc">Contrats, statuts, conformité et documents légaux.</span>
      <span class="admin-card-arrow">→</span>
    </button>
    <button class="admin-card disabled" type="button" onclick="inactiveTile('Finances')">
      <span class="admin-card-num">02</span>
      <span class="admin-card-title">Finances</span>
      <span class="admin-card-desc">Budget, pilotage financier, facturation et prévisionnel.</span>
      <span class="admin-card-arrow">→</span>
    </button>
    <button class="admin-card disabled" type="button" onclick="inactiveTile('Ressources Humaines')">
      <span class="admin-card-num">03</span>
      <span class="admin-card-title">Ressources Humaines</span>
      <span class="admin-card-desc">Collaborateurs, consultants, suivi RH et référentiels internes.</span>
      <span class="admin-card-arrow">→</span>
    </button>
    <a class="admin-card" href="Formats_de_documents.html">
      <span class="admin-card-num">04</span>
      <span class="admin-card-title">Formats de Documents</span>
      <span class="admin-card-desc">Bibliothèque des formats, modèles et documents administratifs.</span>
      <span class="admin-card-arrow">→</span>
    </a>
    <button class="admin-card disabled" type="button" onclick="inactiveTile('Procédures')">
      <span class="admin-card-num">05</span>
      <span class="admin-card-title">Procédures</span>
      <span class="admin-card-desc">Process internes, modes opératoires et référentiels d’exécution.</span>
      <span class="admin-card-arrow">→</span>
    </button>
    <button class="admin-card disabled" type="button" onclick="inactiveTile('Archives')">
      <span class="admin-card-num">06</span>
      <span class="admin-card-title">Archives</span>
      <span class="admin-card-desc">Espace temporaire pour les documents historiques et versions précédentes.</span>
      <span class="admin-card-arrow">→</span>
    </button>
  </section>
  <div class="admin-footer">MyEOD Portal · Administration</div>
</main>
</body>
</html>
