  <title>MyEOD — Services</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
/* === MYEOD STANDARD — MazzardM + Tokens === */
@font-face { font-family:'MazzardM'; src:url('MazzardM-Thin.woff2') format('woff2'); font-weight:100; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-ExtraLight.woff2') format('woff2'); font-weight:200; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-ExtraLightItalic.woff2') format('woff2'); font-weight:200; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-Light.woff2') format('woff2'); font-weight:300; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-LightItalic.woff2') format('woff2'); font-weight:300; font-style:italic; }

@font-face { font-family:'MazzardM'; src:url('MazzardM-Italic.woff2') format('woff2'); font-weight:400; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-Medium.woff2') format('woff2'); font-weight:500; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-MediumItalic.woff2') format('woff2'); font-weight:500; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-SemiBold.woff2') format('woff2'); font-weight:600; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-SemiBoldItalic.woff2') format('woff2'); font-weight:600; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-BoldItalic.woff2') format('woff2'); font-weight:700; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-ExtraBold.woff2') format('woff2'); font-weight:800; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-ExtraBoldItalic.woff2') format('woff2'); font-weight:800; font-style:italic; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-Black.woff2') format('woff2'); font-weight:900; font-style:normal; }
@font-face { font-family:'MazzardM'; src:url('MazzardM-BlackItalic.woff2') format('woff2'); font-weight:900; font-style:italic; }
:root {
  --gold:#b08a2a; --gold-dim:#8a6a1a; --gold-faint:rgba(176,138,42,0.06);
  --teal:#0e7070; --teal-dim:#0a5050;
  --orange:#d4880a; --blue:#2a6099; --red:#c0392b; --green:#1e7a3a; --purple:#7d3c98;
  --p1:#c0392b; --p2:#d4880a; --p3:#1e7a3a;
  --white:#ffffff; --black:#0a0a0a;
  --gray-50:#f8f8f8; --gray-100:#f0f0f0; --gray-200:#e0e0e0;
  --gray-400:#9a9a9a; --gray-600:#555555;
  --border:#e0e0e0; --border-hi:#cccccc;
  --text:#1a1a1a; --text-dim:#444444; --text-muted:#888888;
  --font:'MazzardM',sans-serif; --font-mono:'MazzardM',sans-serif;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ffffff;color:#1a1a1a;font-family:'MazzardM',sans-serif;font-size:11px;line-height:1.6;}
.myeod-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;border-bottom:1px solid var(--gray-200);background:var(--white);position:sticky;top:0;z-index:100;}
.myeod-header-logo{height:72px;}
.myeod-header-logo svg{height:100%;width:auto;display:block;}
.myeod-header-right{display:flex;align-items:center;gap:1rem;}
.btn-nav-back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;font-family:var(--font);font-size:0.9rem;font-weight:700;color:var(--gray-600);background:none;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;transition:border-color .2s,color .2s;}
.btn-nav-back:hover{border-color:var(--black);color:var(--black);}
@media(max-width:600px){.myeod-header{padding:.9rem 1rem;}.myeod-header-logo{height:54px;}}
/* === END MYEOD STANDARD === */

    /* ── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0a0a0a;
      --white:   #ffffff;
      --gray-50: #f8f8f8;
      --gray-100:#f0f0f0;
      --gray-200:#e0e0e0;
      --gray-300:#c7c7c7;
      --gray-400:#9a9a9a;
      --gray-500:#777777;
      --gray-600:#555555;
      --accent:  #0a0a0a;
      --radius:  2px;
      --font: 'MazzardM',sans-serif;
    }

    html, body { width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      overflow: hidden;
    }

    /* ── MAIN APP ─────────────────────────────────────────────────── */
    #app {
      display: block;
      width: 100%;
      height: 100vh;
      overflow-y: auto;
    }
    #app.visible { display: block; }


    /* ── LANDING SCREEN ──────────────────────────────────────────────── */
    #landing-screen {
      width: 100%;
      position: fixed; inset: 0;
      background: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      opacity: 1; transition: opacity 0.6s ease;
    }
    #landing-screen.fade-out { opacity: 0; pointer-events: none; }
    #landing-screen.hidden   { display: none; }

    /* Watermark logo — désactivé */
    .landing-watermark { display: none !important; }

    /* Content on top of watermark */
    .landing-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2.5rem;
      width: 100%; min-height: calc(100vh - 106px); padding: 2rem;
    }

    /* Small logo above tagline */
    .landing-logo {
      width: 450px;
      max-width: 90vw;
    }

    .landing-tagline { display: none; }

    .landing-menu-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      width: min(100%, 500px);
      max-width: 500px;
      padding: 0;
      margin: 0 auto;
    }
    .landing-menu-head.login-box {
      width: min(100%, 500px);
      max-width: 500px;
      padding: 0;
      margin: 0 auto;
    }
    .landing-menu-kicker {
      font-family: var(--font);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gray-400);
    }
    .landing-menu-title {
      font-family: var(--font);
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      line-height: 1.1;
      margin: 0 0 0.4rem 0;
    }
    .landing-menu-subtitle {
      max-width: 520px;
      font-family: var(--font);
      font-size: 0.78rem;
      line-height: 1.7;
      letter-spacing: 0.05em;
      color: var(--gray-500);
    }

    /* 3 cards */
    .landing-cards {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      justify-content: center; width: 100%; max-width: 860px;
    }

    .landing-card {
      flex: 1; min-width: 220px; max-width: 260px;
      border: 1px solid var(--gray-200);
      padding: 2.2rem 1.8rem;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: flex-start; gap: 0.8rem;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      background: #fff;
      position: relative; overflow: hidden;
    }
    .landing-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--gray-200);
      transition: background 0.2s;
    }
    .landing-card:hover {
      border-color: var(--gray-300);
      box-shadow: 0 8px 32px rgba(0,0,0,0.07);
      transform: translateY(-2px);
    }
    .landing-card:hover::before { background: #1a1a1a; }

    .landing-card-num {
      font-family: var(--font);
      font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--gray-300);
    }
    .landing-card-title {
      font-family: var(--font);
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: 0.02em;
      color: #1a1a1a; line-height: 1.3;
    }
    .landing-card-desc {
      font-family: var(--font);
      font-size: 0.68rem; color: var(--gray-400);
      letter-spacing: 0.04em; line-height: 1.7;
    }
    .landing-card-arrow {
      font-size: 0.9rem; color: var(--gray-300);
      margin-top: auto; transition: transform 0.2s, color 0.2s;
    }
    .landing-card:hover .landing-card-arrow {
      transform: translateX(4px); color: #1a1a1a;
    }

    /* Footer IC */
    .landing-footer {
      font-family: var(--font);
      font-size: 0.6rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gray-300);
      text-align: center; padding-bottom: 0.5rem;
    }

    /* ── OVERLAY modals for Qui/Clients ─── */
    #modal-qui, #modal-client {
      position: fixed; inset: 0;
      background: #ffffff;
      z-index: 50; display: none;
      flex-direction: column; align-items: center;
      justify-content: flex-start; overflow-y: auto;
      padding: 3rem 2rem 4rem;
      opacity: 0; transition: opacity 0.4s;
    }
    #modal-qui.open, #modal-client.open {
      display: flex; opacity: 1;
    }
    .modal-close-btn {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: none; border: 1px solid var(--gray-200);
      font-family: var(--font); font-size: 0.65rem;
      font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gray-500);
      padding: 0.45rem 1rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .modal-close-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }

    /* Qui sommes-nous content */
    .qui-wrap { max-width: 860px; width: 100%; }
    .qui-logo  { height: 48px; margin-bottom: 2.5rem; }
    .qui-section-tag {
      font-family: var(--font); font-size: 0.6rem;
      font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gray-400);
      margin-bottom: 0.4rem;
    }
    .qui-title {
      font-family: var(--font); font-size: 2rem;
      font-weight: 800; letter-spacing: -0.01em;
      color: #1a1a1a; margin-bottom: 2rem; line-height: 1.2;
    }
    .qui-body {
      font-family: var(--font); font-size: 0.82rem;
      line-height: 1.85; color: var(--gray-600);
      margin-bottom: 1.5rem;
    }
    .qui-offers {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1rem; margin: 1.5rem 0; width: 100%;
    }
    .qui-offer {
      border: 1px solid var(--gray-200); padding: 1.4rem;
    }
    .qui-offer-title {
      font-family: var(--font); font-size: 0.72rem;
      font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: #1a1a1a;
      margin-bottom: 0.5rem;
    }
    .qui-offer-desc {
      font-family: var(--font); font-size: 0.72rem;
      color: var(--gray-500); line-height: 1.7;
    }
    /* AI loading */
    .qui-ai-state {
      font-family: var(--font); font-size: 0.72rem;
      color: var(--gray-400); letter-spacing: 0.08em;
      padding: 2rem 0; text-align: center;
    }

    /* Client placeholder */
    .client-wrap { max-width: 520px; width: 100%; text-align: center; }
    .client-icon { font-size: 2.5rem; margin-bottom: 1.5rem; }
    .client-title {
      font-family: var(--font); font-size: 1.5rem;
      font-weight: 800; color: #1a1a1a; margin-bottom: 1rem;
    }
    .client-body {
      font-family: var(--font); font-size: 0.78rem;
      color: var(--gray-500); line-height: 1.8; margin-bottom: 2rem;
    }
    .client-coming {
      display: inline-block;
      font-family: var(--font); font-size: 0.65rem;
      font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid var(--gray-200);
      color: var(--gray-400); padding: 0.5rem 1.4rem;
    }


    .client-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .btn-client-primary,
    .btn-client-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      font-family: var(--font);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 24px;
      text-decoration: none;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-client-primary {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #1a1a1a;
    }
    .btn-client-primary:hover,
    .btn-client-primary:focus-visible {
      background: #333;
      border-color: #333;
      outline: none;
    }
    .btn-client-secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid var(--gray-200);
    }
    .btn-client-secondary:hover,
    .btn-client-secondary:focus-visible {
      border-color: #1a1a1a;
      outline: none;
    }

    .new-client-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(4px);
    }
    .new-client-overlay.open { display: flex; }
    .new-client-dialog {
      width: min(760px, 100%);
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--gray-200);
      box-shadow: 0 22px 70px rgba(0,0,0,0.12);
      padding: 2rem;
      position: relative;
      text-align: left;
    }
    .new-client-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid var(--gray-200);
      color: var(--gray-500);
      font-family: var(--font);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }
    .new-client-close:hover,
    .new-client-close:focus-visible {
      border-color: #1a1a1a;
      color: #1a1a1a;
      outline: none;
    }
    .new-client-kicker {
      font-family: var(--font);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray-400);
      margin-bottom: 0.5rem;
    }
    .new-client-title {
      font-family: var(--font);
      font-size: 1.6rem;
      font-weight: 800;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
    }
    .new-client-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .new-client-field { margin-bottom: 1rem; }
    .new-client-field.full { grid-column: 1 / -1; }
    .new-client-field label {
      display: block;
      font-family: var(--font);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-600);
      margin-bottom: 0.4rem;
    }
    .new-client-field input,
    .new-client-field textarea {
      width: 100%;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 0.75rem 0.9rem;
      font-family: var(--font);
      font-size: 0.86rem;
      color: var(--black);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
    }
    .new-client-field textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }
    .new-client-field input:focus,
    .new-client-field textarea:focus { border-color: var(--black); }
    .new-client-help {
      font-family: var(--font);
      font-size: 0.78rem;
      line-height: 1.7;
      color: var(--gray-500);
      margin: 0.5rem 0 0.5rem;
    }
    .new-client-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
      margin-top: 0.8rem;
    }
    .new-client-status {
      min-height: 1.2em;
      flex: 1;
      font-family: var(--font);
      font-size: 0.72rem;
      color: var(--gray-500);
      line-height: 1.5;
    }
    @media (max-width: 700px) {
      .new-client-grid { grid-template-columns: 1fr; }
      .new-client-dialog { padding: 1.5rem; }
      .new-client-footer { justify-content: stretch; }
      .new-client-footer button { width: 100%; }
    }

    @media (max-width: 600px) {
      .landing-cards { flex-direction: column; align-items: center; }
      .landing-card  { max-width: 100%; }
      /* qui-offers: always single row */
      .myeod-header, .dash-header { padding: 0.9rem 1rem; }
      .myeod-header-logo { height: 54px; }
      .dash-header-logo { height: 64px; }
    }



    /* ── SHARED HEADER / CLOSE BUTTON ────────────────────────────── */
    .myeod-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
    }
    .myeod-header-logo { height: 72px; }
    .myeod-header-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-left: auto;
    }
    .btn-close,
    .btn-nav-back {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-600);
      background: none;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn-nav-back {
      width: 34px;
      min-width: 34px;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      line-height: 1;
      letter-spacing: 0;
    }
    .btn-close:hover,
    .btn-close:focus-visible,
    .btn-nav-back:hover,
    .btn-nav-back:focus-visible {
      border-color: var(--black);
      color: var(--black);
      outline: none;
    }

    /* Header partagé sur les pages Services et Accès clients */
    #modal-qui,
    #modal-client {
      padding: 0 0 4rem;
      align-items: stretch;
    }
    #modal-qui .services-header,
    #modal-client .services-header {
      position: sticky;
      top: 0;
      z-index: 60;
      width: 100%;
      flex-shrink: 0;
    }
    /* qui-wrap padding handled by SERVICES LAYOUT FINAL block */

    /* ── LOGIN SCREEN ─────────────────────────────────────────────── */
    #login-screen {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--white);
    }
    #login-screen .login-box {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 500px);
      padding: 0;
      margin: 0 auto;
    }
    #login-screen.hidden { display: none; }

    .login-box {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-form {
      width: 100%;
      max-width: 450px;
    }

    .login-logo {
      width: 100%;
      max-width: 450px;
      display: block;
      margin: 0 0 2.5rem 0;
    }

    .login-title {
      font-family: var(--font);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray-400);
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin: 0.9rem auto 0;
      padding: 0.35rem 0;
      border: 0;
      background: transparent;
      color: var(--gray-400);
      font-family: var(--font);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
    }
    .login-back-link:hover,
    .login-back-link:focus-visible {
      color: var(--gray-600);
      transform: translateX(-3px);
      outline: none;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-600);
      margin-bottom: 0.4rem;

    /* Reset body/app */
    body { overflow-y: auto; }

      position: fixed !important;
      top: 0; left: 0; right: 0;
      z-index: 9999 !important;
      background: #fff !important;
    }
    .btn-nav-back {
      position: relative;
      z-index: 10000 !important;
      pointer-events: auto !important;
    }

    /* Modal — pleine page sous le header */
    #modal-qui, #modal-client {
      position: static !important;
      inset: auto !important;
      display: flex !important;
      opacity: 1 !important;
      z-index: auto !important;
      width: 100%;
      min-height: calc(100vh - 106px);
      background: #fff;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;

      padding: 0 !important;

      align-items: start;
    }

    /* Colonne gauche — sticky */
    .qui-col-text {
      position: sticky;
      top: 106px;
      height: calc(100vh - 106px);
      overflow-y: auto;
      padding: 3rem 2.5rem 3rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Colonne droite — scrollable */
    .qui-col-tiles {

      overflow-y: auto;

    .qui-section-tag {

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function loadQuiContent() {
  const d = {
      "tagline": "BRiDGE : experts, technologies et IA pour accompagner les équipes client sur tout le continuum opérationnel, du concept au decommissioning.",
      "intro": "MyEOD accompagne les équipes industrielles, offshore, énergie et construction avec une approche terrain, rapide et documentée. La marque est portée par Ingénieurs Créatifs (IC) et combine expertise opérationnelle, production documentaire, technologies de capture et outils digitaux.",
      "mission": "Notre mission : apporter le bon niveau d’expertise au bon moment, renforcer les équipes client sans alourdir leurs organisations et sécuriser la préparation, l’exécution, la documentation et la transmission opérationnelle. Nous accompagnons notamment opérateurs énergie, EPCI/EPCIC, EPC, contractors, survey companies, installation contractors, maîtres d’ouvrage, exploitants, industriels, yards, PMO/PMC, partenaires construction-rénovation et équipes corporate.",
      "offers": [
            {
                  "num": "01",
                  "title": "BRiDGE",
                  "url": "service-bridge.html",
                  "desc": "Experts, technologies et IA pour accompagner les équipes client du concept au decommissioning : advisory, DCC, Data Lake, QC, GIS, SIMOPS et reporting."
            },
            {
                  "num": "02",
                  "title": "Visual Intelligence",
                  "url": "service-visual-intelligence.html",
                  "desc": "Drone, photogrammétrie, nuages de points, orthophotos, détection IA et rapports visuels pour sites industriels, offshore et construction."
            },
            {
                  "num": "03",
                  "title": "Staffing Augmenté",
                  "url": "service-staffing-augmente.html",
                  "desc": "Experts mobilisables avec toolbox BRiDGE : survey, PMT, GIS, DCC, HSE, installation et support opérations."
            },
            {
                  "num": "04",
                  "title": "Marque Blanche",
                  "url": "service-marque-blanche.html",
                  "desc": "Déploiement des expertises MyEOD sous identité client pour opérateurs, EPCI, contractors, survey companies et partenaires."
            },
            {
                  "num": "05",
                  "title": "Médias & reportages industriels",
                  "url": "service-medias-reportages.html",
                  "desc": "Photos, vidéos, maquettes et reportages institutionnels énergie/construction, par équipes HSE mobilisables worldwide."
            }
      ]
};

  // Colonne gauche — texte
  const textCol = document.getElementById('qui-content-text');
  if (textCol) {
    textCol.innerHTML =
      '<p class="qui-body-tagline">\u201c' + escapeHTML(d.tagline) + '\u201d</p>' +
      '<p class="qui-body">' + escapeHTML(d.intro) + '</p>' +
      '<p class="qui-body">' + escapeHTML(d.mission) + '</p>';
  }

  // Colonne droite — grille tuiles
  const grid = document.getElementById('qui-offers-grid');
  if (grid) {
    const tilesHtml = d.offers.map(function(o){
      const href = o.url ? ' href="' + escapeHTML(o.url) + '"' : '';
      return '<a class="qui-offer"' + href + ' aria-label="Découvrir ' + escapeHTML(o.title) + '">' +
        '<p class="qui-offer-num">' + escapeHTML(o.num) + ' \u2014</p>' +
        '<p class="qui-offer-title">' + escapeHTML(o.title) + '</p>' +
        '<p class="qui-offer-desc">' + escapeHTML(o.desc) + '</p>' +
        '</a>';
    }).join('');
    grid.innerHTML = tilesHtml;
  }
}
document.addEventListener('DOMContentLoaded', loadQuiContent);
</script>
